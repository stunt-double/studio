name: Release

on:
  push:
    branches: [main]
  # Re-runs the publish step by hand. It only publishes a version npm does not
  # already have.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing and provenance: npm exchanges the job's OIDC token.
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    # A manual run can target any branch, so only `main` may publish.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      # No `registry-url`: an npm token from setup-node, even an empty one,
      # stops `npm publish` from trying the OIDC exchange.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # npm 11.5.1 or later does the OIDC exchange for trusted publishing.
      - run: npm install -g npm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Google Chrome
        run: google-chrome --version || pnpm exec playwright-core install --with-deps chrome
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      # With pending changesets this opens (or updates) the "Version packages"
      # pull request. Merging it runs this again with nothing pending, and
      # `pnpm release` builds, publishes the new version to npm, tags it and
      # creates its GitHub release.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
